<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolt — Taskbar Robot</title>
<style>
  :root {
    --bar-h: 56px;
    --bot: #cfd8e3;
    --bot-dark: #9aa7b8;
    --bot-edge: #6c7889;
    --eye: #4cc2ff;
    --eye-glow: rgba(76,194,255,0.8);
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1b2030 0%, #0d1018 70%);
    color: #e7ecf3;
    overflow: hidden;
    user-select: none;
  }

  .hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    text-align: center; opacity: 0.55; font-size: 14px; line-height: 1.6;
    pointer-events: none;
  }
  .hint b { color: var(--accent); font-weight: 600; }

  /* ---- Taskbar ---- */
  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h);
    background: linear-gradient(180deg, #232a3a, #161b27);
    border-top: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    z-index: 10;
  }
  .tb-orb {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--eye), #2b8bd6);
    box-shadow: 0 0 12px var(--eye-glow);
    display: grid; place-items: center; font-size: 16px;
  }
  .tb-app {
    width: 34px; height: 34px; border-radius: 8px; flex: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: grid; place-items: center; font-size: 17px; opacity: 0.8;
  }
  .tb-spacer { flex: 1; }
  .tb-clock { font-variant-numeric: tabular-nums; font-size: 14px; opacity: 0.75; padding-right: 6px; }

  /* ---- Robot ---- */
  #bot {
    position: fixed; left: 80px; bottom: var(--bar-h);
    width: 48px; height: 60px;
    cursor: pointer; z-index: 20;
    transform-origin: bottom center;
    transition: filter 0.2s;
  }
  #bot:hover { filter: brightness(1.12) drop-shadow(0 0 6px var(--eye-glow)); }
  #bot.facing-left { transform: scaleX(-1); }

  .bot-shadow {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 8px; border-radius: 50%;
    background: rgba(0,0,0,0.45); filter: blur(3px);
  }

  .bot-body {
    position: absolute; bottom: 14px; left: 6px;
    width: 36px; height: 30px; border-radius: 11px 11px 9px 9px;
    background: linear-gradient(160deg, #eef3f9 0%, var(--bot) 45%, var(--bot-dark) 100%);
    border: 1.5px solid var(--bot-edge);
    box-shadow: inset 0 3px 4px rgba(255,255,255,0.6), inset 0 -4px 6px rgba(0,0,0,0.18);
  }
  /* face screen */
  .bot-face {
    position: absolute; top: 5px; left: 5px; width: 26px; height: 16px;
    border-radius: 7px; background: #11151f;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .eye {
    position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--eye); box-shadow: 0 0 6px var(--eye-glow);
    transition: height 0.08s, top 0.08s;
  }
  .eye.left { left: 6px; }
  .eye.right { right: 6px; }
  .mouth {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 9px; height: 2px; border-radius: 2px; background: var(--eye);
    opacity: 0.55; box-shadow: 0 0 4px var(--eye-glow);
  }
  /* antenna */
  .antenna { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 2px; height: 11px; background: var(--bot-edge); }
  .antenna::after {
    content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: blip 1.6s ease-in-out infinite;
  }
  @keyframes blip { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* arms */
  .arm { position: absolute; bottom: 20px; width: 5px; height: 16px; border-radius: 4px;
         background: linear-gradient(var(--bot), var(--bot-dark)); border: 1px solid var(--bot-edge);
         transform-origin: top center; }
  .arm.left { left: 2px; }
  .arm.right { right: 2px; }

  /* legs */
  .leg { position: absolute; bottom: 0; width: 6px; height: 16px;
         background: linear-gradient(var(--bot-dark), var(--bot-edge)); border-radius: 3px;
         transform-origin: top center; }
  .leg.left { left: 13px; }
  .leg.right { left: 25px; }
  .foot { position: absolute; bottom: -2px; left: -2px; width: 11px; height: 5px; border-radius: 3px; background: #3a4250; }

  /* ---- walking ---- */
  #bot.walking .leg.left  { animation: stepA 0.5s linear infinite; }
  #bot.walking .leg.right { animation: stepB 0.5s linear infinite; }
  #bot.walking .arm.left  { animation: swingB 0.5s linear infinite; }
  #bot.walking .arm.right { animation: swingA 0.5s linear infinite; }
  #bot.walking .bot-body  { animation: bob 0.5s linear infinite; }
  @keyframes stepA { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(-20deg); } }
  @keyframes stepB { 0%,100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
  @keyframes swingA { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
  @keyframes swingB { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  /* ---- sleeping ---- */
  #bot.sleeping { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  #bot.sleeping .eye { height: 1.5px; top: 8px; background: var(--bot-edge); box-shadow: none; }
  #bot.sleeping .mouth { opacity: 0; }
  #bot.sleeping .antenna::after { animation: none; opacity: 0.3; box-shadow: none; }
  .zzz { position: absolute; top: -6px; right: -8px; font-size: 14px; color: var(--eye);
         opacity: 0; pointer-events: none; }
  #bot.sleeping .zzz { animation: floatZ 2.2s ease-in-out infinite; }
  @keyframes floatZ {
    0% { opacity: 0; transform: translate(0,0) scale(0.7); }
    30% { opacity: 0.9; }
    100% { opacity: 0; transform: translate(10px,-26px) scale(1.1); }
  }

  /* ---- waving / dancing ---- */
  #bot.waving .arm.right { animation: wave 0.4s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: rotate(150deg); } 50% { transform: rotate(110deg); } }
  #bot.dancing { animation: dance 0.45s ease-in-out infinite; }
  @keyframes dance { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-5px); } }
  #bot.dancing .arm.left  { animation: swingA 0.45s linear infinite; }
  #bot.dancing .arm.right { animation: swingB 0.45s linear infinite; }

  #bot.jumping { animation: jump 0.6s ease-out; }
  @keyframes jump { 0% { transform: translateY(0); } 35% { transform: translateY(-46px); } 100% { transform: translateY(0); } }

  /* ---- speech bubble ---- */
  .bubble {
    position: fixed; z-index: 25; bottom: calc(var(--bar-h) + 66px);
    background: #fff; color: #1b2030; padding: 7px 12px; border-radius: 12px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35); opacity: 0; transform: translateY(6px);
    transition: opacity 0.18s, transform 0.18s; pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translateY(0); }
  .bubble::after {
    content: ''; position: absolute; bottom: -6px; left: 22px;
    border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  /* ---- click menu ---- */
  .menu {
    position: fixed; z-index: 30; bottom: calc(var(--bar-h) + 70px);
    background: #1f2533; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 6px; min-width: 160px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    display: none; flex-direction: column;
  }
  .menu.open { display: flex; animation: pop 0.14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
  .menu-head { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
               opacity: 0.45; padding: 6px 10px 8px; }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; color: #e7ecf3; font-size: 14px; font-family: inherit;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
  }
  .menu button:hover { background: rgba(255,255,255,0.08); }
  .menu button .ic { width: 20px; text-align: center; font-size: 15px; }
</style>
</head>
<body>

  <div class="hint">
    Meet <b>Bolt</b> — your taskbar robot.<br>
    He strolls along the bar on his own. <b>Click him</b> for tricks, or let him doze off. 🤖
  </div>

  <!-- fake taskbar -->
  <div id="taskbar">
    <div class="tb-orb">⌂</div>
    <div class="tb-app">📁</div>
    <div class="tb-app">🌐</div>
    <div class="tb-app">✉️</div>
    <div class="tb-app">🎵</div>
    <div class="tb-spacer"></div>
    <div class="tb-clock" id="clock">--:--</div>
  </div>

  <!-- robot -->
  <div id="bot" class="walking">
    <div class="zzz">z</div>
    <div class="antenna"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="bot-body">
      <div class="bot-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="leg left"><div class="foot"></div></div>
    <div class="leg right"><div class="foot"></div></div>
    <div class="bot-shadow"></div>
  </div>

  <div class="bubble" id="bubble"></div>

  <div class="menu" id="menu">
    <div class="menu-head">Bolt says hi 👋</div>
    <button data-act="wave"><span class="ic">👋</span> Wave hello</button>
    <button data-act="dance"><span class="ic">🕺</span> Bust a move</button>
    <button data-act="jump"><span class="ic">⬆️</span> Jump!</button>
    <button data-act="joke"><span class="ic">😄</span> Tell a joke</button>
    <button data-act="sleep"><span class="ic">😴</span> Take a nap</button>
    <button data-act="wake"><span class="ic">☀️</span> Wake up</button>
  </div>

<script>
(function () {
  const bot    = document.getElementById('bot');
  const bubble = document.getElementById('bubble');
  const menu   = document.getElementById('menu');
  const BAR_H  = 56;

  // --- state ---
  const S = {
    x: 80,
    dir: 1,            // 1 = right, -1 = left
    speed: 0.55,       // px per frame
    mode: 'walking',   // walking | sleeping | tricking | paused
    bubbleTimer: null,
    idleTimer: null,
    lastFrame: 0,
  };

  const W = () => window.innerWidth;
  const botW = 48;

  function setMode(m) {
    S.mode = m;
    bot.classList.remove('walking', 'sleeping', 'waving', 'dancing', 'jumping');
    if (m === 'walking') bot.classList.add('walking');
    if (m === 'sleeping') bot.classList.add('sleeping');
  }

  function face(dir) {
    S.dir = dir;
    bot.classList.toggle('facing-left', dir < 0);
  }

  function say(text, ms = 2200) {
    clearTimeout(S.bubbleTimer);
    bubble.textContent = text;
    positionBubble();
    bubble.classList.add('show');
    S.bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  function positionBubble() {
    bubble.style.left = Math.min(W() - 220, Math.max(8, S.x - 6)) + 'px';
  }
  function positionMenu() {
    menu.style.left = Math.min(W() - 180, Math.max(8, S.x - 50)) + 'px';
  }

  // --- main loop ---
  function loop(t) {
    if (S.mode === 'walking') {
      S.x += S.speed * S.dir;
      const max = W() - botW - 8;
      if (S.x >= max) { S.x = max; face(-1); maybeChatter(); }
      if (S.x <= 8)   { S.x = 8;   face(1);  maybeChatter(); }
      bot.style.left = S.x + 'px';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // occasional thoughts while strolling
  const THOUGHTS = [
    'Just stretching my legs…', 'Beep boop. 🤖', 'Lovely day on the taskbar!',
    'Patrolling… all clear.', 'Anyone need a hand?', 'Step, step, step…'
  ];
  function maybeChatter() {
    if (Math.random() < 0.4 && S.mode === 'walking') {
      say(THOUGHTS[Math.floor(Math.random() * THOUGHTS.length)], 1800);
    }
  }
  setInterval(() => {
    if (S.mode === 'walking' && Math.random() < 0.2) maybeChatter();
  }, 5000);

  // --- tricks ---
  function doTrick(name, cls, dur, msg) {
    const wasSleeping = S.mode === 'sleeping';
    setMode('tricking');
    bot.classList.add(cls);
    if (msg) say(msg, dur);
    setTimeout(() => {
      bot.classList.remove(cls);
      setMode(wasSleeping ? 'sleeping' : 'walking');
    }, dur);
  }

  const JOKES = [
    'Why was the robot tired? It had a hard drive! 💽',
    'I only speak binary. 01001000 01101001!',
    'I never byte off more than I can chew. 🦾',
    "I'd tell you a UDP joke, but you might not get it.",
    'My favorite music? Heavy metal. 🤘'
  ];

  const ACTIONS = {
    wave:  () => doTrick('wave', 'waving', 1600, 'Hello there! 👋'),
    dance: () => doTrick('dance', 'dancing', 2600, '🎵 woo! 🎵'),
    jump:  () => doTrick('jump', 'jumping', 600, 'Wheee!'),
    joke:  () => { wake(); say(JOKES[Math.floor(Math.random()*JOKES.length)], 3500); },
    sleep: () => sleep(),
    wake:  () => { wake(); say('Good morning! ☀️', 1600); },
  };

  function sleep() {
    setMode('sleeping');
    closeMenu();
    say('Powering down… 😴', 1500);
  }
  function wake() {
    if (S.mode === 'sleeping' || S.mode === 'tricking') setMode('walking');
  }

  // --- interaction ---
  bot.addEventListener('click', (e) => {
    e.stopPropagation();
    if (menu.classList.contains('open')) { closeMenu(); return; }
    if (S.mode === 'sleeping') { wake(); say('*yawn* …who clicked me?', 2000); return; }
    openMenu();
  });

  function openMenu() {
    setMode('paused');
    positionMenu();
    menu.classList.add('open');
  }
  function closeMenu() {
    menu.classList.remove('open');
    if (S.mode === 'paused') setMode('walking');
  }

  menu.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    menu.classList.remove('open');
    if (ACTIONS[act]) ACTIONS[act]();
  });

  document.addEventListener('click', () => { if (menu.classList.contains('open')) closeMenu(); });

  // double-click anywhere on bot area to make him jump to the cursor playfully
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  window.addEventListener('resize', () => {
    S.x = Math.min(S.x, W() - botW - 8);
    bot.style.left = S.x + 'px';
    positionBubble(); positionMenu();
  });

  // --- clock ---
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  tick(); setInterval(tick, 1000);

  // intro
  bot.style.left = S.x + 'px';
  setTimeout(() => say('Hi, I\'m Bolt! Click me. 🤖', 3000), 800);
})();
</script>
</body>
</html>
